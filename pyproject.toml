# ============================================
# PROJECT CONFIGURATION
# ============================================
[project]
name = "colosseum"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
	"ty>=0.0.1a34,<0.0.1a35",
	"pydantic>=2.12.5,<3",
	"evdev>=1.9.2,<2",
	"tyro>=1.0.1,<2",
	"pytest>=8.0.2,<10",
	"wandb>=0.24.1,<0.25.0",
	"ipykernel"
]

[tool.pixi.workspace]
channels = [
	"https://prefix.dev/pixi-build-backends",
	"robostack-humble",
    "https://prefix.dev/conda-forge",
    "https://prefix.dev/spqr",
    "https://prefix.dev/spqr-tests",
]
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

# ============================================
# TRAIN FEATURE
# ============================================
[tool.pixi.environments.train]
features = ["deploy", "train"]
no-default-feature = true
solve-group = "train"

[tool.pixi.feature.train]
platforms = ["linux-64"]

[tool.pixi.feature.train.dependencies]
python = "3.11.*"

[tool.pixi.feature.train.system-requirements]
cuda = "12.0"

[tool.pixi.feature.train.pypi-dependencies]
colosseum = {path = ".", editable = true}
loguru = "==0.7.3"
gymnasium = {version = "*", extras = ["classic_control"]}
mjlab = {git = "https://github.com/neverorfrog/mjlab.git", branch = "main", editable = true}

[tool.pixi.feature.train.tasks]
train-rsl-rl = { cmd = "python -m colosseum.scripts.train_rsl_rl", description = "Train with RSL-RL (colosseum tasks)" }
train-mjlab = { cmd = "python -m mjlab.scripts.train", description = "Train with RSL-RL (mjlab built-in tasks)" }
train = { cmd = "python -m colosseum.scripts.train", description = "Train with custom PPO" }
play = { cmd = "python -m colosseum.scripts.play", description = "Evaluate trained policy in simulation" }
export-onnx = { cmd = "python -m colosseum.scripts.export_onnx", description = "Export checkpoint to ONNX" }

# ============================================
# DEPLOY FEATURE
# ============================================
[tool.pixi.environments.deploy]
features = ["deploy"]
no-default-feature = true
solve-group = "deploy"

[tool.pixi.feature.deploy]
platforms = ["linux-64"]

[tool.pixi.feature.deploy.dependencies]
python = "3.11.*"
pytorch = "*"
onnxruntime = ">=1.22.2,<2"

[tool.pixi.feature.deploy.pypi-dependencies]
mujoco = ">=3.4.0,<4"
colosseum = {path = ".", editable = true}

[tool.pixi.feature.deploy.tasks]
deploy = { cmd = "python -m colosseum.scripts.deploy", description = "Deploy trained policy" }

# ============================================
# ARENA FEATURE
# ============================================

[tool.pixi.environments.arena]
features = ["arena"]
no-default-feature = true
solve-group = "arena"

[tool.pixi.feature.arena]
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.feature.arena.dependencies]
cmake = "==4.3.0"
gtest = "*"
booster_robotics_sdk = "==1.5.0"
tinyxml2 = "*"
eigen = "*"
onnxruntime-cpp = "==1.24.2"
msgpack-cxx = "*"
mujoco = ">=3.0"
glfw = "*"
boost-cpp = "*"
libgl-devel = "==1.7.0"
libegl-devel = "==1.7.0"

# Cross-compilation tools (only needed on the build machine)
[tool.pixi.feature.arena.target.linux-64.dependencies]
gxx_linux-64 = "*"
gxx_linux-aarch64 = "*"
make = "*"
pkg-config = "*"
sysroot_linux-64 = ">=2.39"
sysroot_linux-aarch64 = ">=2.39"

[tool.pixi.feature.arena.target.linux-aarch64.dependencies]
sysroot_linux-aarch64 = ">=2.39"
gtest = "*"

[tool.pixi.feature.arena.tasks]
gen-booster-stubs = { cmd = "python -m nanobind.stubgen -m booster_robotics_sdk_python -o typings/booster_robotics_sdk_python.pyi", description = "Generate stubs for booster_robotics_sdk_python into typings/" }
configure = { cmd = "cmake -S $PIXI_PROJECT_ROOT -B $PIXI_PROJECT_ROOT/build -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DCMAKE_CXX_COMPILER=$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-g++", description = "Configure CMake" }
compile = { cmd = "sh -c 'cmake --build $PIXI_PROJECT_ROOT/build -j${JOBS:-1}'", depends-on = ["configure"], description = "Compile arena" }
main = { cmd = "$PIXI_PROJECT_ROOT/build/src/arena/main", env = { MODELS_DIR = "$PIXI_PROJECT_ROOT/models", LD_LIBRARY_PATH = "$CONDA_PREFIX/lib" }, depends-on = ["compile"], description = "Run arena main (plain CMake build)" }
gdb-main = { cmd = "gdb $PIXI_PROJECT_ROOT/build/src/arena/main", env = { MODELS_DIR = "$PIXI_PROJECT_ROOT/models", LD_LIBRARY_PATH = "$CONDA_PREFIX/lib" }, depends-on = ["compile"], description = "Run arena in gdb (plain CMake build)" }
clear = { cmd = "rm -rf $PIXI_PROJECT_ROOT/build", description = "Clear the build directory" }
build = {cmd = "rattler-build build --recipe recipe.yaml --target-platform linux-aarch64 --channel file:///$PIXI_PROJECT_ROOT/local-channel/channel --no-include-recipe"}

[tool.pixi.feature.arena.system-requirements]
libc = "2.39"

# ============================================
# DOCS FEATURE
# ============================================

[tool.pixi.environments.docs]
features = ["docs"]
no-default-feature = true
solve-group = "docs"

[tool.pixi.feature.docs.dependencies]
mkdocs-material = ">=9.6.14,<10"

[tool.pixi.feature.docs.tasks]
build-docs = "mkdocs build --strict"
docs = { cmd = "mkdocs serve", description = "Serve the docs locally" }

# ============================================
# OTHER TOOLS
# ============================================
[tool.ty.environment]
extra-paths = ["typings"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["typings", "models"]

[tool.ruff]
src = ["src"]
indent-width = 2
